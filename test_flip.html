<html><body><canvas id='c' width='400' height='400'></canvas><script src='https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js'></script><script>window.onerror = function(msg) { console.log('ERROR:', msg); }; const canvas = new fabric.Canvas('c'); const rect = new fabric.Rect({left: 100, top: 100, width: 50, height: 50, fill: 'red'}); canvas.add(rect); rect.controls.flipX = new fabric.Control({x: 0, y: -0.5, cursorStyle: 'pointer', actionHandler: function(eventData, transform, x, y) { try { const target = transform.target; const center = target.getCenterPoint(); target.set('flipX', !target.flipX); target.setPositionByOrigin(center, 'center', 'center'); target.setCoords(); target.set('dirty', true); if (target.canvas) { target.canvas.fire('object:modified', { target: target }); target.canvas.requestRenderAll(); } return true; } catch (e) { console.log('ERROR IN HANDLER:', e.message); return false; } }, render: function(ctx, left, top) { ctx.fillStyle='blue'; ctx.fillRect(left-10, top-10, 20, 20); }}); canvas.renderAll(); </script></body></html>
