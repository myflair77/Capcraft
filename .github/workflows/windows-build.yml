name: Windows installer build (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install browser dependencies
        run: npm ci --ignore-scripts --omit=optional
      - name: Build offline assets
        run: npm run vendor
      - name: Install test browser
        run: npx puppeteer browsers install chrome
      - name: Verify OCR model downloads
        run: python scripts/setup_ocr.py
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: Editor, rendering and OCR UI tests
        run: npm test
      - name: Build application
        run: python -m PyInstaller --noconfirm --distpath dist-dev --workpath build/ci Capcraft_v1.2.spec
      - name: Check packaged Qt dependencies
        run: python tests/dll_imports.py
      - name: Build unsigned installer
        run: |
          $compiler = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Expected Inno Setup 6 on the Windows runner' }
          & $compiler installer_v1.2.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          (Get-Item -LiteralPath $compiler).VersionInfo.FileVersion | Set-Content dist-dev/Installer/inno-version.txt
      - name: Record build provenance and hashes
        run: |
          $artifacts = Get-ChildItem dist-dev/Installer -Filter '*.exe'
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one installer' }
          $hash = Get-FileHash -LiteralPath $artifacts[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($artifacts[0].Name)" | Set-Content dist-dev/Installer/SHA256SUMS.txt
          @{ commit=$env:GITHUB_SHA; run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; signing='unsigned'; python=(python --version); node=(node --version); inno=(Get-Content dist-dev/Installer/inno-version.txt) } | ConvertTo-Json | Set-Content dist-dev/Installer/build-info.json
          python -m pip freeze | Set-Content dist-dev/Installer/python-environment.txt
      - name: Upload review artifact (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Capcraft-Windows-unsigned-${{ github.sha }}
          path: dist-dev/Installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
